# Build one R package from a git URL with r-universe's reusable build workflow.
# Dispatch: gh workflow run build-package.yml -f repository=<url> -f ref=<branch|sha>
name: Build package
run-name: ${{ inputs.repository }}@${{ inputs.ref }}${{ inputs.run_id && format(' [{0}]', inputs.run_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Git URL of the package
        required: true
      ref:
        # ponytail: build.yml defaults ref to *this* repo's sha, so a ref is always passed
        description: Branch or commit to build (Bioconductor git uses devel / RELEASE_3_xx)
        default: devel
      universe:
        description: r-universe universe the dependencies come from (bioc is devel, bioc-release is release)
        default: bioc
      branch:
        # build-source writes ref into RemoteSha as given and takes RemoteRef from here, so a
        # caller that wants the commit recorded passes the sha as ref and the branch here.
        description: Upstream branch that ref is on, recorded in the tarball (e.g. RELEASE_3_24)
        default: ''
      subdir:
        description: Package subdirectory, if any
        default: ''
      skip:
        description: Platforms to skip, e.g. "macos windows wasm"
        default: ''
      run_id:
        description: Caller's correlation id, shown in the run name
        default: ''

jobs:
  build:
    # Vendored copy of r-universe's build.yml, minus oldrel (see its header).
    uses: ./.github/workflows/rubuild.yml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      subdir: ${{ inputs.subdir }}
      skip: ${{ inputs.skip }}
      universe: ${{ inputs.universe }}   # dependencies come from <universe>.r-universe.dev
      organization: bioconductor  # adds the BiocCheck job; no extra repos
      # JSON built from pieces: a literal "}}" inside the expression would be fragile.
      variables: ${{ format('{0}{1}{2}', '{"UPSTREAMBRANCH":"', inputs.branch, '"}') }}
      timeout: 90                 # what r-universe gives Bioconductor packages

  summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write result.json
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          RESULT: ${{ needs.build.result }}
        run: |
          jq -n --arg repository '${{ inputs.repository }}' --arg ref '${{ inputs.ref }}' \
                --arg run_id '${{ inputs.run_id }}' --arg package "$PACKAGE" \
                --arg version "$VERSION" --arg result "$RESULT" \
                '$ARGS.named' > result.json
          cat result.json
          echo "### $PACKAGE $VERSION: $RESULT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
